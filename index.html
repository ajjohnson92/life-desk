<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex, nofollow">
<title>Life Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Life Desk's "Carbon" look (22 Nov 2026, as on the PC since 20 Nov): near-black and greys, one orange accent */
:root, :root[data-theme="dark"] {
  --bg: #0b0b0c; --surface: #161618; --field: #1c1c1f; --border: #2a2a2e; --hover: #232326; --bar: #080808;
  --fg: #ececec; --muted: #8a8a8a; --dim: #6a6a6a; --accent: #ff7a45; --accent-fg: #140a05; --warn: #ffb15c;
  --good: #5cc98a; --bad: #ff5a4f; --alert: #21160f; --alert-edge: #a8502b; --sel: #2a1a12;
  /* the status labels (theme.py "badges") */
  --b-ns: #26262a; --b-ns-fg: #b5b5b5; --b-due: #4b2226; --b-due-fg: #f4a3a3; --b-draft: #4a3518; --b-draft-fg: #f7c27a;
  --b-sub: #1d3b2a; --b-sub-fg: #8fd6a5; --b-skip: #222224; --b-skip-fg: #8a8a8a;
}
:root[data-theme="light"] {
  --bg: #f5f5f4; --surface: #e9e9e7; --field: #ffffff; --border: #c9c9c6; --hover: #dededb; --bar: #ebebe9;
  --fg: #1f2328; --muted: #6b7280; --dim: #9ca3af; --accent: #2563eb; --accent-fg: #ffffff; --warn: #b45309;
  --good: #2f9e5f; --bad: #c62828; --alert: #fdf0dc; --alert-edge: #e0a040; --sel: #e6eefd;
  --b-ns: #e3e8f2; --b-ns-fg: #3b4a66; --b-due: #fbdcdc; --b-due-fg: #9b1c1c; --b-draft: #fdebd3; --b-draft-fg: #8a4b08;
  --b-sub: #dcf2e3; --b-sub-fg: #1d6b3a; --b-skip: #e7e7e5; --b-skip-fg: #6b7280;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); touch-action: pan-x pan-y; }  /* the page never zooms */
body { font: 15px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; min-height: 100vh;
  padding: env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: var(--fg); }
button { background: var(--hover); border: 1px solid var(--border); border-radius: 9px; padding: 9px 14px; cursor: pointer; font-weight: 600; }
button:active { background: var(--border); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button:disabled { opacity: .5; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* the top: date and the page's name, like the PC */
header { display: flex; align-items: flex-end; gap: 10px; padding: 14px 16px 6px; }
header .titles { flex: 1; min-width: 0; }
header .date { font-size: 12px; color: var(--muted); }
header h1 { font-size: 26px; margin: 0; font-weight: 600; letter-spacing: -.2px; }
.synced { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding-bottom: 6px; }
.synced .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.synced.stale { color: var(--warn); } .synced.stale .dot { background: var(--warn); }
.synced.busy .dot { background: var(--accent); }
.icon-btn { width: 38px; height: 38px; padding: 0; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 2px; }
main { padding: 6px 16px 24px; }

/* the bar along the bottom */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bar); border-top: 1px solid var(--border);
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
nav.tabs button { background: none; border: 0; border-radius: 10px; padding: 6px 2px 4px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; position: relative; }
nav.tabs button.on { color: var(--fg); }
nav.tabs button.on svg { color: var(--accent); }
nav.tabs .count { position: absolute; top: 2px; left: calc(50% + 8px); background: var(--accent); color: var(--accent-fg);
  font-size: 10px; border-radius: 8px; padding: 0 5px; line-height: 16px; }

.bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.seg { display: inline-flex; flex: 1; background: var(--field); border-radius: 11px; padding: 4px; gap: 2px; }
.seg button { flex: 1; border: none; background: transparent; padding: 7px 8px; border-radius: 8px; color: var(--muted); font-size: 14px; }
.seg button.on { background: var(--hover); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.bar .primary { white-space: nowrap; padding: 9px 16px; }
.info { font-size: 13px; margin: 0 0 8px; }
.info.warn { color: var(--warn); }
.readonly { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }

/* cards and rows */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 14px 10px; margin-bottom: 12px; }
.card.alert { background: var(--alert); border-color: var(--alert-edge); }
.caps { font-size: 11px; letter-spacing: .18em; color: var(--muted); font-weight: 600; text-transform: uppercase; margin: 0 0 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card.alert .caps { color: var(--accent); }
.caps a { letter-spacing: 0; text-transform: none; color: var(--accent); font-size: 13px; text-decoration: none; }
.big { font-size: 26px; font-weight: 600; line-height: 1.1; }
.big small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.clear { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 4px 0 6px; }
.clear .tick { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #2f3a33; display: inline-flex; align-items: center; justify-content: center; color: var(--good); }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: block; width: 100%; text-align: left; background: var(--field); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px; font-weight: 400; }
.card .row { background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 9px 2px; }
.card .row:first-of-type { border-top: 0; }
.row:active { background: var(--hover); }
.row .top { display: flex; align-items: flex-start; gap: 8px; }
.row .t { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .sub { font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.row .wait { font-size: 12px; color: var(--warn); margin-top: 3px; }
.row.ticked .t { color: var(--muted); }
.row .thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; background: var(--hover);
  display: inline-flex; align-items: center; justify-content: center; color: var(--good); }
.section { font-size: 11px; letter-spacing: .18em; color: var(--muted); font-weight: 600; margin: 14px 2px 6px; }
.note { text-align: center; color: var(--muted); padding: 32px 8px; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; white-space: nowrap; flex: none; }
.s-overdue { background: var(--b-due); color: var(--b-due-fg); }
.s-today, .s-due, .s-price { background: var(--b-draft); color: var(--b-draft-fg); }
.s-soon, .s-coming { background: var(--b-ns); color: var(--b-ns-fg); }
.s-later, .s-nodate, .s-removed { background: var(--b-skip); color: var(--b-skip-fg); }
.s-done { background: var(--b-sub); color: var(--b-sub-fg); }
.s-list { background: #3a2516; color: #ff9466; }

/* sheets (details, add / edit) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10; display: flex; align-items: flex-end; }
.sheet { background: var(--surface); border-top: 1px solid var(--border); width: 100%; border-radius: 18px 18px 0 0;
  max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet h2 { font-size: 20px; margin: 8px 0 4px; overflow-wrap: anywhere; font-weight: 600; }
.sheet h3 { font-size: 11px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin: 18px 0 6px; }
.sheet .body { white-space: pre-wrap; font-size: 14px; background: var(--field); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px; overflow-wrap: anywhere; }
.sheet .btns { display: flex; gap: 8px; margin-top: 16px; }
.sheet .btns button { flex: 1; padding: 12px 8px; }
.sheet .danger { color: var(--b-due-fg); background: transparent; }
.sheet img.photo { width: 112px; height: 112px; object-fit: cover; border-radius: 14px; background: var(--field); }  /* the 56 px photo, so kept small */
.task { background: var(--field); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
.task .top { display: flex; align-items: center; gap: 8px; }
.task .t { font-weight: 600; flex: 1; }
.task .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
.hist div { font-size: 13px; color: var(--muted); margin: 2px 0; }
label.f { display: block; font-weight: 600; margin: 14px 0 5px; }
.sheet input, .sheet select, .sheet textarea { width: 100%; background: var(--field); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 11px; }
.sheet textarea { min-height: 76px; resize: vertical; }
.sheet input:focus, .sheet select:focus, .sheet textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chips button { font-size: 13px; padding: 6px 12px; border-radius: 14px; }
.read { font-size: 13px; color: var(--muted); margin-top: 6px; }
.err { color: var(--bad); font-size: 13px; min-height: 1.2em; margin-top: 8px; }
.search { width: 100%; background: var(--field); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.search:focus { outline: 2px solid var(--accent); border-color: transparent; }

.toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 20;
  background: var(--field); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; font-size: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.4); }

/* lock screen */
.lock { max-width: 380px; width: calc(100% - 32px); margin: 12vh auto 0; padding: 26px 20px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 18px; text-align: center; }
.lock img { width: 64px; height: 64px; border-radius: 16px; }
.lock h1 { font-size: 22px; margin: 10px 0 4px; font-weight: 600; }
.lock input { width: 100%; margin: 16px 0 10px; padding: 11px; font: 600 17px/1 ui-monospace, Consolas, monospace;
  letter-spacing: 1px; text-align: center; background: var(--field); color: var(--fg); border: 1px solid var(--border);
  border-radius: 10px; text-transform: uppercase; }
.lock input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.lock .err { min-height: 1.3em; }
.lock button { width: 100%; padding: 11px; }
</style>
</head>
<body>
<div id="lock" class="lock hidden">
  <img src="icon-192.png" alt="">
  <h1>Life Desk</h1>
  <div class="muted" id="lockNote">Enter your phone code. It's in Life Desk on your PC: Settings (the cog) → Phone app → Show code.</div>
  <form id="lockForm">
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX">
    <div class="err" id="lockErr"></div>
    <button class="primary" id="unlockBtn">Unlock</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="titles"><div class="date" id="today"></div><h1 id="pageTitle">Home</h1></div>
    <div class="synced" id="synced"><span class="dot"></span><span id="syncedText"></span></div>
    <button class="icon-btn" id="reload" title="Check for a newer copy" aria-label="Check for a newer copy">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/></svg></button>
  </header>
  <main>
    <div class="info muted hidden" id="pending"></div>
    <div id="page"></div>
  </main>
  <nav class="tabs" aria-label="Life Desk">
    <button data-tab="home"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>Home</button>
    <button data-tab="todo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>To do<span class="count hidden" id="todoCount"></span></button>
    <button data-tab="notes"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg>Notes</button>
    <button data-tab="plans"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Reminders</button>
    <button data-tab="garden"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9M12 12c0-4 3-7 7-7 0 4-3 7-7 7zM12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>Garden<span class="count hidden" id="gardenCount"></span></button>
  </nav>
</div>
<div id="sheet" class="sheet-bg hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
// The same choices as Life Desk's Add to do window (todo_core.py)
const REPEATS = [["none", "Doesn't repeat"], ["week", "Every week"], ["month", "Every month"], ["year", "Every year"]];
const WARNINGS = [[0, "On the day"], [1, "1 day before"], [3, "3 days before"], [7, "1 week before"],
  [14, "2 weeks before"], [30, "1 month before"]];
const DEFAULT_WARN = 3;
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const WD_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MON_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October",
  "November", "December"];
const TITLES = {home: "Home", todo: "To do", notes: "Notes", plans: "Reminders", garden: "Garden"};
const LEAF = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9M12 12c0-4 3-7 7-7 0 4-3 7-7 7zM12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>`;
const CHECK_EVERY = 30000;  // while a change waits for the PC, look for a newer copy this often
const $ = (id) => document.getElementById(id);
const store = {  // localStorage can be unavailable; the page still works without it
  get(k) { try { return localStorage.getItem("lifedesk-" + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("lifedesk-" + k, v); } catch (e) {} },
};
let snap = null, key = null, keySalt = null, locked = null, queue = [];
let tab = store.get("tab") || "home", view = store.get("view") || "todo", planView = store.get("planView") || "reminders";
let noteSearch = "";
let sendError = "", busy = false;

// ---- dates (all local, as text YYYY-MM-DD like Life Desk)
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function parseIso(s) { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); }
function todayDate() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function nowIso() { const n = new Date(); return `${iso(n)}T${[n.getHours(), n.getMinutes(), n.getSeconds()].map((x) => String(x).padStart(2, "0")).join(":")}`; }
function niceDate(d, today = todayDate()) { return `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}` + (d.getFullYear() === today.getFullYear() ? "" : ` ${d.getFullYear()}`); }
function longDate(d) { return `${WD_LONG[d.getDay()]} ${d.getDate()} ${MON_LONG[d.getMonth()]} ${d.getFullYear()}`; }
function ago(s) {
  if (!s) return "never";
  const m = Math.floor((Date.now() - new Date(s)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 2880 ? `${Math.floor(m / 60)} h ago` : `${Math.floor(m / 1440)} days ago`;
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function addMonths(d, n, day) {  // keeps the original day where the month has it (31 Jan -> 28 Feb -> 31 Mar)
  const t = d.getMonth() + n, y = d.getFullYear() + Math.floor(t / 12), m = ((t % 12) + 12) % 12;
  const last = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(day || d.getDate(), last));
}
function nextDate(item, d) {
  if (item.repeat === "week") return addDays(d, 7);
  if (item.repeat === "month") return addMonths(d, 1, item.day);
  if (item.repeat === "year") return addMonths(d, 12, item.day);
  return d;
}
function inDays(d, today = todayDate()) {  // "Today", "Tomorrow", "In 5 days", "Mon 3 Dec", "Mar 2027"
  const days = daysBetween(today, d);
  if (days < 0) return "Overdue";
  return days === 0 ? "Today" : days === 1 ? "Tomorrow" : days <= 31 ? `In ${days} days`
    : days <= 300 ? niceDate(d, today) : `${MON[d.getMonth()]} ${d.getFullYear()}`;
}

// ---- a to-do's state, worked out here so the colours are right on any day (todo_core.state)
function state(t, today = todayDate()) {
  if (t.removed) return "removed";
  if (t.done) return "done";
  if (!t.due) return "nodate";
  const days = daysBetween(today, parseIso(t.due));
  if (days < 0) return "overdue";
  if (days === 0) return "today";
  return days <= (t.warn ?? DEFAULT_WARN) ? "soon" : "later";
}
function badgeText(t, today = todayDate()) {
  const s = state(t, today);
  if (s === "overdue") return "Overdue";
  if (s === "today") return "Today";
  if (s === "soon" || s === "later") return inDays(parseIso(t.due), today);
  return {nodate: "No date", done: "Done", removed: "Removed"}[s];
}
function detailsLine(t, today = todayDate()) {
  const bits = [];
  if (t.due) {
    const d = parseIso(t.due), days = daysBetween(today, d);
    bits.push(`due ${niceDate(d, today)}` + (days < 0 ? ` (${-days} day${days !== -1 ? "s" : ""} ago)` : ""));
  }
  if ((t.repeat || "none") !== "none") bits.push(Object.fromEntries(REPEATS)[t.repeat].toLowerCase());
  const w = t.warn ?? DEFAULT_WARN;
  if (t.due && w) bits.push(`warns ${Object.fromEntries(WARNINGS)[w] || w + " days before"}`);
  if (t.notes) bits.push(t.notes.split("\n")[0].slice(0, 80));
  return bits.join("  ·  ") || "no due date";
}
// reminders, renewals and garden jobs, as their tabs on the PC colour them
function planState(dueIso, warn, extra = 30, today = todayDate()) {
  const days = daysBetween(today, parseIso(dueIso));
  return days < 0 ? "overdue" : days <= warn ? (days === 0 ? "today" : "due") : days <= extra ? "coming" : "later";
}
function taskState(nextIso, today = todayDate()) {  // garden_core.state
  if (!nextIso) return "later";
  const days = daysBetween(today, parseIso(nextIso));
  return days < -7 ? "overdue" : days <= 0 ? "due" : days <= 7 ? "soon" : "later";
}
function taskWhen(nextIso, today = todayDate()) {
  if (!nextIso) return "–";
  const d = parseIso(nextIso), days = daysBetween(today, d);
  return days <= 0 ? "Now" : inDays(d, today);
}

// ---- storage on the phone (IndexedDB "life-desk"): the unlocked key (not the code), the last locked copy, and
// changes not yet in Life Desk
function db() {
  return new Promise((ok, bad) => {
    const r = indexedDB.open("life-desk", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error);
  });
}
async function kvGet(k) {
  try { const d = await db(); return await new Promise((ok) => { const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(undefined); }); }
  catch (e) { return undefined; }
}
async function kvPut(k, v) {
  try { const d = await db(); await new Promise((ok) => { const t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = ok; t.onerror = ok; }); } catch (e) {}
}
const saveQueue = () => kvPut("queue", queue);

// ---- locking: AES-256-GCM with a key made from the phone code (PBKDF2-SHA256), the same as phone_sync.py
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const tob64 = (u8) => { let s = ""; u8.forEach((b) => { s += String.fromCharCode(b); }); return btoa(s); };
async function makeKey(code, l) {
  const raw = new TextEncoder().encode(code.toUpperCase().replace(/[^A-Z0-9]/g, ""));
  const base = await crypto.subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64(l.salt), iterations: l.iter},
    base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
}
async function unlock(k, l) {
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(l.iv)}, k, b64(l.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function lockUp(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  return {v: 1, iter: locked.iter, salt: keySalt, iv: tob64(iv), data: tob64(data)};
}

// ---- getting the latest copy: from the page's own site (works offline from the last one), and straight from
// GitHub when the phone's token is known (newer, as the site can take a minute or two to catch up)
async function fetchSite() {
  const r = await fetch(`snapshot.json?t=${Date.now()}`, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status === 503 ? "offline" : `HTTP ${r.status}`);
  return r.json();
}
async function fetchDirect() {
  if (!snap || !snap.phone_token || !snap.page_repo) return null;
  const r = await fetch(`${snap.api}/repos/${snap.page_repo}/contents/snapshot.json?t=${Date.now()}`,
    {cache: "no-store", headers: {Authorization: `Bearer ${snap.phone_token}`, Accept: "application/vnd.github.raw"}});
  return r.ok ? r.json() : null;
}

async function start() {
  queue = (await kvGet("queue")) || [];
  const saved = await kvGet("key"), cached = await kvGet("snapshot");
  if (saved && cached && saved.salt === cached.salt) {
    try { key = saved.key; keySalt = saved.salt; locked = cached; show(await unlock(key, cached)); }
    catch (e) { key = null; }
  }
  refresh();
}

async function refresh() {
  if (busy) return;
  busy = true; $("synced").classList.add("busy");
  try {
    const copies = [];
    try { copies.push(await fetchSite()); } catch (e) {}
    try { const d = await fetchDirect(); if (d) copies.push(d); } catch (e) {}
    if (!key) {
      locked = copies[0] || locked || await kvGet("snapshot");
      return locked ? showLock("") : showLock("Couldn't download your list - check you have signal and try again.");
    }
    let best = null, bestLocked = null;
    for (const l of copies) {
      if (l.salt !== keySalt) {  // Life Desk has a new phone code
        key = null; locked = l;
        return showLock("Life Desk has a new phone code. Enter the new one (Settings → Phone app → Show code). Anything you changed here is kept.");
      }
      try { const d = await unlock(key, l); if (!best || d.made > best.made) { best = d; bestLocked = l; } } catch (e) {}
    }
    if (best && (!snap || best.made >= snap.made)) {
      locked = bestLocked; await kvPut("snapshot", bestLocked);
      show(best);
    }
    await sendQueue();
  } finally {
    busy = false; $("synced").classList.remove("busy");
    if (snap) { render(); }
  }
}

function showLock(msg) {
  $("app").classList.add("hidden"); $("lock").classList.remove("hidden");
  $("lockErr").textContent = msg;
}
$("lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!locked) return refresh();
  $("unlockBtn").disabled = true; $("lockErr").textContent = "Unlocking...";
  try {
    const k = await makeKey($("code").value, locked);
    const data = await unlock(k, locked);
    key = k; keySalt = locked.salt;
    await kvPut("key", {salt: locked.salt, key: k});
    await kvPut("snapshot", locked);
    $("code").value = ""; $("lockErr").textContent = "";
    show(data);
    refresh();
  } catch (err) { $("lockErr").textContent = "That code didn't unlock it - check it in Life Desk and try again."; }
  $("unlockBtn").disabled = false;
});

// ---- sending changes: each one is locked here and put in the private data repository as its own file
async function sendQueue() {
  if (!snap || !key) return;
  const waiting = queue.filter((c) => !c.sent);
  if (!waiting.length) { sendError = ""; return; }
  if (!snap.phone_token || !snap.data_repo) { sendError = "notoken"; return; }
  for (const ch of waiting) {
    const {sent, ...body} = ch;
    let r;
    try {
      const file = await lockUp(body);
      r = await fetch(`${snap.api}/repos/${snap.data_repo}/contents/changes/${ch.id}.json`, {
        method: "PUT", cache: "no-store",
        headers: {Authorization: `Bearer ${snap.phone_token}`, Accept: "application/vnd.github+json"},
        body: JSON.stringify({message: "Change from the phone", content: btoa(JSON.stringify(file))})});
    } catch (e) { sendError = "offline"; return; }
    if (r.ok || r.status === 422) {  // 422: that file is already there, so it was sent before
      ch.sent = true; await saveQueue();
    } else if (r.status === 409) {  // GitHub was busy with another change: try again shortly
      sendError = "retry"; setTimeout(() => sendQueue().then(render), 3000); return;
    } else {
      sendError = r.status === 401 ? "expired" : `GitHub said ${r.status}`; return;
    }
  }
  sendError = "";
}
async function queueChange(op, item, extra = {}) {
  const seq = Number(store.get("seq") || 0) + 1; store.set("seq", seq);
  const rand = tob64(crypto.getRandomValues(new Uint8Array(6))).replace(/[+/=]/g, "x");
  const at = nowIso();
  queue.push({id: `${at.replace(/[-:]/g, "")}-${rand}`, at, seq, op, item, ...extra, sent: false});
  await saveQueue();
  render();
  await sendQueue();
  render();
}
const newTempId = () => "p" + tob64(crypto.getRandomValues(new Uint8Array(6))).replace(/[+/=]/g, "x");

// ---- the to-do list: Life Desk's copy, with this phone's changes not yet in it laid on top
function current() {
  const applied = new Set(snap.applied || []);
  const items = snap.items.map((t) => ({...t}));
  const done = snap.done.map((h) => ({...h}));
  const find = (id) => items.find((t) => t.id === id || t.phone_id === id);
  const today = todayDate();
  for (const ch of queue) {
    if (applied.has(ch.id)) continue;
    const mark = ch.sent ? "sent" : "unsent";
    if (ch.op === "add") {
      items.push({id: ch.item, phone_id: ch.item, ...ch.fields, created: ch.at, day: ch.fields.due ? parseIso(ch.fields.due).getDate() : null, waiting: mark});
      continue;
    }
    const t = find(ch.item);
    if (!t) continue;
    if (ch.op === "edit") Object.assign(t, ch.fields, {day: ch.fields.due ? parseIso(ch.fields.due).getDate() : null, changed: ch.at, waiting: mark});
    else if (ch.op === "remove") t.removed = ch.at;
    else if (ch.op === "done") {
      done.unshift({id: t.id, title: t.title, at: ch.at, due: t.due, note: ch.note || "", repeat: t.repeat, waiting: mark});
      if ((t.repeat || "none") !== "none" && t.due) {  // moves on to its next date, as Life Desk will
        let nxt = nextDate(t, parseIso(t.due));
        while (nxt <= today) nxt = nextDate(t, nxt);
        t.due = iso(nxt); t.waiting = mark;
      } else t.done = ch.at;
    }
  }
  const todo = items.filter((t) => !t.done && !t.removed)
    .sort((a, b) => (!a.due - !b.due) || (a.due || "").localeCompare(b.due || "") || a.title.toLowerCase().localeCompare(b.title.toLowerCase()));
  done.sort((a, b) => b.at.localeCompare(a.at));
  return {todo, done, find};
}
const needsYou = (t, today) => ["overdue", "today", "soon"].includes(state(t, today));
function gardenDue() {
  const out = [];
  for (const p of (snap.garden?.plants || [])) for (const t of p.tasks) {
    if (["due", "overdue"].includes(taskState(t.next))) out.push({p, t});
  }
  return out;
}

// ---- showing it
function show(data) {
  snap = data;
  snap.api = snap.api || "https://api.github.com";
  document.documentElement.dataset.theme = data.theme === "light" ? "light" : "dark";
  store.set("theme", document.documentElement.dataset.theme);
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  $("lock").classList.add("hidden"); $("app").classList.remove("hidden");
  // changes Life Desk has dealt with: dropped here, and any it couldn't use are explained
  const applied = new Set(snap.applied || []);
  const results = Object.fromEntries((snap.results || []).map((r) => [r.id, r]));
  const gone = queue.filter((c) => applied.has(c.id));
  if (gone.length) {
    queue = queue.filter((c) => !applied.has(c.id)); saveQueue();
    const skipped = gone.map((c) => results[c.id]).filter((r) => r && r.result !== "ok");
    if (skipped.length) toast("Not used by Life Desk: " + skipped.map((r) => r.message).join(" "), 9000);
  }
  render();
}

function todoRow(t, today) {
  return `<button class="row" data-id="${esc(t.id)}">
    <div class="top"><span class="badge s-${state(t, today)}">${esc(badgeText(t, today))}</span>
      <span class="t">${esc(t.title)}${(t.repeat || "none") !== "none" ? " ↻" : ""}</span></div>
    <div class="sub">${esc(detailsLine(t, today))}</div>
    ${t.waiting ? `<div class="wait">${t.waiting === "sent" ? "Waiting for your PC" : "Not sent yet"}</div>` : ""}
  </button>`;
}

function render() {
  if (!snap) return;
  const today = todayDate();
  const age = (Date.now() - new Date(snap.made)) / 3600000;
  $("synced").classList.toggle("stale", age > 48);
  $("syncedText").textContent = age > 48 ? `PC last seen ${ago(snap.made)}` : `updated ${ago(snap.made)}`;
  $("today").textContent = `${WD_LONG[today.getDay()]} ${today.getDate()} ${MON_LONG[today.getMonth()]}`;
  $("pageTitle").textContent = TITLES[tab];
  document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  const {todo} = current();
  const waiting = todo.filter((t) => needsYou(t, today)).length, gdue = gardenDue().length;
  $("todoCount").textContent = waiting; $("todoCount").classList.toggle("hidden", !waiting);
  $("gardenCount").textContent = gdue; $("gardenCount").classList.toggle("hidden", !gdue);
  // changes waiting
  const unsent = queue.filter((c) => !c.sent).length, sent = queue.filter((c) => c.sent).length;
  const p = $("pending"); let text = "", warn = false;
  if (unsent) {
    const n = `${unsent} change${unsent > 1 ? "s" : ""} not sent yet`;
    text = sendError === "offline" ? `${n} - no signal. They're kept here and sent when there is.`
      : sendError === "expired" ? `${n}: GitHub didn't accept the phone's token - it may have expired. Make a new one in Life Desk (Settings → Phone app).`
      : sendError === "notoken" ? `${n}: the phone's token isn't set up yet - add it in Life Desk (Settings → Phone app).`
      : sendError && sendError !== "retry" ? `${n} (${sendError}). They're kept here - press ↻ to try again.`
      : `Sending ${unsent} change${unsent > 1 ? "s" : ""}...`;
    warn = !!sendError && sendError !== "retry";
  } else if (sent) {
    text = `${sent} change${sent > 1 ? "s" : ""} waiting for Life Desk on your PC (it checks every minute while it's open).`;
  }
  p.textContent = text; p.classList.toggle("hidden", !text); p.classList.toggle("warn", warn);
  ({home: renderHome, todo: renderTodo, notes: renderNotes, plans: renderPlans, garden: renderGarden}[tab] || renderHome)();
}

// ---- Home: what needs you, like the PC's Home tab
function renderHome() {
  const today = todayDate(), {todo} = current();
  const waiting = todo.filter((t) => needsYou(t, today)), undated = todo.filter((t) => !t.due);
  const coming = [...(snap.reminders || []).map((r) => ({kind: "r", name: r.label, date: r.due, st: planState(r.due, r.warn, 0)})),
    ...(snap.renewals || []).map((r) => ({kind: "n", name: `${r.name} renews`, date: r.renews,
      st: r.add_price ? "price" : planState(r.renews, r.warn, 0)}))]
    .filter((x) => ["overdue", "today", "due", "price"].includes(x.st)).sort((a, b) => a.date.localeCompare(b.date));
  const gdue = gardenDue(), pinned = (snap.notes || []).filter((n) => n.pinned).slice(0, 3);

    h += `<div class="big">${waiting.length}<small>${[od ? od + " overdue" : "", td ? td + " today" : "", waiting.length - od - td ? (waiting.length - od - td) + " coming up" : ""].filter(Boolean).join(" · ")}</small></div>`;

  h += `</div>`;
  h += `<div class="card${coming.length ? " alert" : ""}"><div class="caps">Reminders &amp; renewals <a href="#" data-go="plans">Open ›</a></div>`;
  h += coming.length ? coming.map((x) => `<div class="row"><div class="top"><span class="badge s-${x.st}">${x.st === "price" ? "Add price" : esc(inDays(parseIso(x.date), today))}</span><span class="t">${esc(x.name)}</span></div></div>`).join("")
    : clear("Nothing coming up.");
  h += `</div>`;
  if (snap.garden) {
    h += `<div class="card${gdue.length ? " alert" : ""}"><div class="caps">Garden <a href="#" data-go="garden">Open ›</a></div>`;
    h += gdue.length ? gdue.slice(0, 5).map(({p, t}) => `<div class="row"><div class="top"><span class="badge s-due">Now</span><span class="t">${esc(t.task)}: ${esc(p.name)}</span></div></div>`).join("")
      : clear((snap.garden.plants || []).length ? "No plant care due." : "No plants yet - add them in Life Desk on your PC.");
    h += `</div>`;

  if (pinned.length) {
    h += `<div class="card"><div class="caps">Pinned notes <a href="#" data-go="notes">Open ›</a></div>` +
      pinned.map((n) => `<button class="row" data-note="${esc(n.id)}"><div class="t">${esc(n.title)}</div></button>`).join("") + `</div>`;
  }
  $("page").innerHTML = h;
}

  if (el.dataset.view) { view = el.dataset.view; store.set("view", view); return render(); }
  if (el.dataset.plan) { planView = el.dataset.plan; store.set("planView", planView); return render(); }
  if (el.dataset.id) return details(el.dataset.id);
  if (el.dataset.note) return noteSheet(el.dataset.note);
  if (el.dataset.rem) return reminderSheet([...snap.reminders].sort((a, b) => a.due.localeCompare(b.due))[Number(el.dataset.rem)]);
  if (el.dataset.ren) return renewalSheet([...snap.renewals].sort((a, b) => a.renews.localeCompare(b.renews))[Number(el.dataset.ren)]);
  if (el.dataset.plant) return plantSheet(snap.garden.plants[Number(el.dataset.plant)]);
});
$("reload").onclick = () => refresh();

// ---- sheets
function openSheet(html) {
  const s = $("sheet");
  $("toast").classList.add("hidden");  // so a message never sits over the sheet
  s.innerHTML = `<div class="sheet">${html}</div>`;
  s.classList.remove("hidden");
  return s.firstElementChild;
}
function closeSheet() { $("sheet").classList.add("hidden"); $("sheet").innerHTML = ""; }
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
function toast(text, ms = 4000) {
  const t = $("toast"); t.textContent = text; t.classList.remove("hidden");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.add("hidden"), ms);
}
const closeBtn = `<div class="btns"><button id="sClose">Close</button></div>`;
function withClose(el) { const b = el.querySelector("#sClose"); if (b) b.onclick = closeSheet; return el; }

function noteSheet(id) {
  const n = (snap.notes || []).find((x) => x.id === id);
  if (!n) return;
  withClose(openSheet(`<div class="muted" style="font-size:12px">Edited ${esc(niceDate(parseIso(n.edited)))}${n.pinned ? " · pinned" : ""}</div>
    <div class="body" style="margin-top:8px;font-size:15px">${esc(n.text)}</div>${closeBtn}`));
}
function reminderSheet(r) {
  if (!r) return;
  const today = todayDate(), st = planState(r.due, r.warn);
  withClose(openSheet(`<span class="badge s-${st}">${esc(inDays(parseIso(r.due), today))}</span><h2>${esc(r.label)}</h2>
    <div class="muted">Due ${esc(longDate(parseIso(r.due)))} · ${esc(r.every.toLowerCase())}</div>
    ${r.last ? `<div class="muted">Last done ${esc(niceDate(parseIso(r.last), today))}</div>` : ""}
    ${r.on_list ? `<div class="row" style="margin-top:10px"><div class="sub">It's on your to-do list - tick it off there when it's done.</div></div>` : ""}
    ${r.notes ? `<h3>Notes</h3><div class="body">${esc(r.notes)}</div>` : ""}${closeBtn}`));
}
function renewalSheet(r) {
  if (!r) return;
  const today = todayDate(), st = r.add_price ? "price" : planState(r.renews, r.warn, 90);
  withClose(openSheet(`<span class="badge s-${st}">${r.add_price ? "Add price" : esc(inDays(parseIso(r.renews), today))}</span><h2>${esc(r.name)}</h2>
    <div class="muted">${esc(r.provider || "Provider not known")} · renews ${esc(longDate(parseIso(r.renews)))} · ${esc(r.every.toLowerCase())}</div>
    <div class="muted">Last price: ${esc(r.price)}${r.auto ? " · renews automatically" : ""}</div>
    ${r.on_list ? `<div class="row" style="margin-top:10px"><div class="sub">Its reminder is on your to-do list. Tick it off there with who you went with and what you paid (e.g. Admiral £380).</div></div>` : ""}
    ${r.notes ? `<h3>Notes</h3><div class="body">${esc(r.notes)}</div>` : ""}${closeBtn}`));
}
function plantSheet(p) {
  if (!p) return;
  const today = todayDate();
  withClose(openSheet(`${p.thumb ? `<img class="photo" src="data:image/png;base64,${p.thumb}" alt="">` : ""}
    <h2>${esc(p.name)}</h2>
    <div class="muted">${p.latin ? `<i>${esc(p.latin)}</i> · ` : ""}${p.indoor ? "House plant" : "Garden plant"}${p.where ? " · " + esc(p.where) : ""}</div>
    ${p.summary ? `<p style="margin:10px 0 0">${esc(p.summary)}</p>` : ""}
    <h3>Care</h3>${p.tasks.length ? p.tasks.map((t) => `<div class="task"><div class="top"><span class="badge s-${taskState(t.next)}">${esc(taskWhen(t.next, today))}</span><span class="t">${esc(t.task)}</span></div>
      <div class="sub">${esc(t.often)}${t.last ? " · last done " + esc(niceDate(parseIso(t.last), today)) : ""}</div>${t.how ? `<div class="sub" style="color:var(--fg)">${esc(t.how)}</div>` : ""}</div>`).join("")
      : `<div class="muted">No care plan yet.</div>`}
    ${p.notes ? `<h3>Notes</h3><div class="body">${esc(p.notes)}</div>` : ""}${closeBtn}`));
}

function details(id) {
  const {todo} = current();
  const t = todo.find((x) => x.id === id);
  if (!t) return;
  const today = todayDate(), repeating = (t.repeat || "none") !== "none";
  const before = snap.done.filter((h) => h.id === t.id).slice(0, 6);
  const el = openSheet(`
    <span class="badge s-${state(t, today)}">${esc(badgeText(t, today))}</span>
    <h2>${esc(t.title)}${repeating ? " ↻" : ""}</h2>
    <div class="muted">${esc(detailsLine(t, today))}</div>
    ${t.waiting ? `<div class="row" style="margin-top:10px"><div class="wait">${t.waiting === "sent" ? "Your change is waiting for Life Desk on your PC." : "Your change isn't sent yet."}</div></div>` : ""}
    ${t.notes ? `<h3>Notes</h3><div class="body">${esc(t.notes)}</div>` : ""}
    ${before.length ? `<h3>Done before</h3><div class="hist">${before.map((h) => `<div>${esc(niceDate(parseIso(h.at), today))}${h.note ? "  ·  " + esc(h.note) : ""}</div>`).join("")}</div>` : ""}
    ${repeating ? `<label class="f" for="note">Note when ticking off (optional)</label><input id="note" placeholder="e.g. Paid £205, or who did it" autocomplete="off">` : ""}
    <div class="btns"><button class="primary" id="sDone">✓ Done</button><button id="sEdit">Edit</button><button id="sRemove" class="danger">Remove</button></div>`);
  el.querySelector("#sDone").onclick = async () => {
    const note = repeating ? el.querySelector("#note").value.trim() : "";
    closeSheet();
    await queueChange("done", t.phone_id || t.id, {note, due: t.due});
    toast(repeating ? `Done: ${t.title}. It moves on to its next date.` : `Done: ${t.title}.`);
  };
  el.querySelector("#sEdit").onclick = () => editor(t);
  el.querySelector("#sRemove").onclick = () => {
    const c = openSheet(`<h2>Remove "${esc(t.title)}"?</h2>
      <p class="muted">It's kept in Life Desk's Removed view on your PC, where you can restore it.</p>
      <div class="btns"><button class="primary" id="cYes">Remove</button><button id="cNo">Cancel</button></div>`);
    c.querySelector("#cNo").onclick = closeSheet;
    c.querySelector("#cYes").onclick = async () => {
      closeSheet();
      await queueChange("remove", t.phone_id || t.id);
      toast(`Removed: ${t.title}.`);
    };
  };
}

function editor(t) {
  const el = openSheet(`
    <h2>${t ? "Edit to do" : "Add to do"}</h2>
    <label class="f" for="eTitle">What needs doing</label>
    <input id="eTitle" autocomplete="off" value="${esc(t ? t.title : "")}">
    <label class="f" for="eDue">Due date</label>
    <input id="eDue" type="date" value="${esc(t && t.due ? t.due : "")}">
    <div class="chips"><button data-d="0">Today</button><button data-d="1">Tomorrow</button><button data-d="7">Next week</button><button data-d="">No date</button></div>
    <div class="read" id="eRead"></div>
    <label class="f" for="eRepeat">Repeats</label>
    <select id="eRepeat">${REPEATS.map(([k, l]) => `<option value="${k}"${(t ? t.repeat || "none" : "none") === k ? " selected" : ""}>${l}</option>`).join("")}</select>
    <label class="f" for="eWarn">Warn me</label>
    <select id="eWarn">${WARNINGS.map(([k, l]) => `<option value="${k}"${(t ? t.warn ?? DEFAULT_WARN : DEFAULT_WARN) === k ? " selected" : ""}>${l}</option>`).join("")}</select>
    <label class="f" for="eNotes">Notes</label>
    <textarea id="eNotes">${esc(t ? t.notes || "" : "")}</textarea>
    <div class="err" id="eErr"></div>
    <div class="btns"><button class="primary" id="eSave">${t ? "Save" : "Add"}</button><button id="eCancel">Cancel</button></div>`);
  const due = el.querySelector("#eDue");
  const showRead = () => { el.querySelector("#eRead").textContent = due.value ? longDate(parseIso(due.value)) : "No due date"; };
  showRead();
  due.addEventListener("input", showRead); due.addEventListener("change", showRead);
  el.querySelectorAll(".chips button").forEach((b) => b.onclick = () => {
    due.value = b.dataset.d === "" ? "" : iso(addDays(todayDate(), Number(b.dataset.d))); showRead();
  });
  el.querySelector("#eCancel").onclick = closeSheet;
  el.querySelector("#eSave").onclick = async () => {
    const title = el.querySelector("#eTitle").value.trim(), repeat = el.querySelector("#eRepeat").value;
    const err = el.querySelector("#eErr");
    if (!title) { err.textContent = "Type what needs doing first."; return; }
    if (repeat !== "none" && !due.value) { err.textContent = "A repeating item needs a due date, so Life Desk knows when it's next due."; return; }
    const fields = {title, due: due.value || null, repeat, warn: Number(el.querySelector("#eWarn").value),
      notes: el.querySelector("#eNotes").value.trim()};
    closeSheet();
    if (t) { await queueChange("edit", t.phone_id || t.id, {fields}); toast(`Saved changes to: ${title}.`); }
    else {
      await queueChange("add", newTempId(), {fields});
      toast(`Added: ${title}` + (fields.due ? `, due ${niceDate(parseIso(fields.due))}.` : "."));
    }
  };
  if (!t) setTimeout(() => el.querySelector("#eTitle").focus(), 50);
}

// ---- keeping up to date
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
addEventListener("online", () => refresh());
setInterval(() => { if (document.visibilityState === "visible" && snap && queue.length) refresh(); }, CHECK_EVERY);
setInterval(() => { if (snap && !document.activeElement?.matches?.("input,textarea")) render(); }, 60000);  // "updated n min ago", and Today / Overdue after midnight

document.documentElement.dataset.theme = store.get("theme") || "dark";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
start();
</script>
</body>
</html>
